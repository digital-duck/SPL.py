[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spl-llm"
version = "3.3.0"
description = "SPL — A Declarative Language for Agentic LLM Workflow Orchestration"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Wen Gong", email = "p2p2learn@outlook.com"},
]
keywords = [
    "llm", "agentic-ai", "workflow", "orchestration", "dsl",
    "prompt-engineering", "multi-agent", "declarative", "spl",
    "langchain", "langgraph", "ollama", "openai", "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # dd-* ecosystem (all published on PyPI)
    "dd-llm[openai]>=0.1.0",
    "dd-vectordb>=0.1.0",
    "dd-embed>=0.1.0",
    "dd-cache>=0.1.0",
    "dd-config>=0.1.0",
    "dd-extract>=0.1.0",
    "dd-db>=0.1.0",
    "dd-logging>=0.1.2",
    # LLM provider SDKs
    "anthropic>=0.25.0",
    # Jupyter kernel management (required by spl3 run for kernelspec detection)
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    # symbolic math (used by SOLVE/ASSERT kernel expressions)
    "sympy>=1.12",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "streamlit-aggrid>=1.0.5",
    "streamlit-ace>=0.1.1",
    "chromadb>=0.5",
]
kernel = [
    "ipython>=8.0",
    "ipykernel>=6.0",
    "jupyter_client>=8.0",
]
mcp = [
    "mcp>=1.0",
]
media = [
    # image_convert/image_resize/image_info stdlib tools.
    # audio_*/video_* stdlib tools additionally require the ffmpeg system
    # binary (not pip-installable) — see docs/GUIDE/USER-GUIDE.md.
    "Pillow>=10.0",
]
sage = [
    # SageMath as pip wheels (passagemath fork — resolves wheels-only, no source build).
    # After install, register the 'sagemath' Jupyter kernel spec:
    #   python -m sage.repl.ipython_kernel.install --user
    # then run workflows under it:
    #   spl3 run workflow.spl --kernel-name sagemath
    # Conda alternative (distro-native Sage): conda install -c conda-forge sage
    "passagemath-standard>=10.8",
    "ipykernel>=6.0",
    "jupyter_client>=8.0",
]
solver = [
    # Deterministic solver backends for the cookbook-solver/ recipes.
    # `pip install spl-llm[solver]` sets up every pip-installable solver.
    # A few recipes also need non-pip system binaries — see
    # cookbook-solver/README.md ("Installing dependencies").
    #
    # Optimization / operations research
    "pulp>=2.7",              # LP / MILP  (r78, r100, r101, r109)
    "ortools>=9.7",           # CP-SAT + routing  (r87, r98)
    "cvxpy>=1.4",             # convex / QP portfolio  (r99)
    "pymoo>=0.6",             # NSGA-II multi-objective  (r107)
    "mip>=1.15",              # python-mip MILP  (r108)
    "pyomo>=6.7",             # two-stage stochastic LP  (r117) — needs a solver binary (glpk)
    "scipy>=1.11",            # constrained nonlinear (SLSQP / DE)  (r114)
    "scikit-optimize>=0.9",   # Bayesian optimization (GP + EI)  (r113)
    "optuna>=3.4",            # black-box optimization (TPE)  (r112)
    # Logic / SMT / constraints
    "z3-solver>=4.12",        # SMT theorem prover  (r102, r118)
    "python-constraint>=1.4", # finite-domain CSP  (r82)
    # Game theory
    "nashpy>=0.0.38",         # 2-player Nash equilibria  (r110)
    "pygambit>=16.1",         # N-player Nash  (r115) — needs a C++ toolchain
    "open_spiel>=1.4",        # CFR, imperfect-info games  (r116) — heavy build
    # Data / stats / geospatial / graph / units
    "pandas>=2.0",            # data-quality checks  (r103)
    "pandera>=0.18",          # dataframe schema validation  (r104)
    "shapely>=2.0",           # geospatial coverage  (r106)
    "statsmodels>=0.14",      # structural time-series forecasting  (r119)
    "networkx>=3.0",          # graph algorithms  (r81)
    "numpy>=1.24",            # conservation-law recompute  (r90, r92)
    "pint>=0.22",             # dimensional analysis  (r83)
    "yfinance>=0.2",          # market data for portfolio opt  (r99)
    # Property-based verification
    "hypothesis>=6.0",        # falsification tests  (r79, r85)
    # Newer solver classes (r122–r126)
    "pyscipopt>=5.0",         # SCIP hard MILP — bundles the SCIP binary  (r123)
    "highspy>=1.7",           # HiGHS LP/MILP — subproblem solver  (r123, r125 progressive hedging)
    "simpy>=4.0",             # discrete-event simulation  (r124)
    "minizinc>=0.9",          # MiniZinc Python bindings  (r126) — needs the MiniZinc binary too
    # r122 (global MINLP) uses pyomo + scipy above; its global solver
    # (Couenne / Bonmin) is a non-pip binary — see README. r126 also needs
    # the MiniZinc system binary; r117 needs a Pyomo solver binary (glpk).
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build>=1.0",
    "twine>=5.0",
    "ddgs>=6.0",
    "duckduckgo_search>=6.0",
    # test_storage / test_code_rag exercise the vector + embedding backends
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/digital-duck/SPL.py"
Repository = "https://github.com/digital-duck/SPL.py"
Documentation = "https://github.com/digital-duck/SPL.py/blob/main/README.md"
"Bug Tracker" = "https://github.com/digital-duck/SPL.py/issues"
"arXiv Paper" = "https://arxiv.org/abs/2602.21257"

[project.scripts]
spl3 = "spl3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spl*"]

[tool.setuptools.package-data]
"spl3" = ["_skill/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
