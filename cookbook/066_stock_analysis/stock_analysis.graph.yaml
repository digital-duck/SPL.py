version: 1.0-graph
workflow:
  name: stock_analysis
  inputs:
  - name: tickers
    type: TEXT
    default: AAPL,META,GOOG, CRM
  - name: days
    type: INT
    default: 30
  outputs:
  - name: report
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_tickers
  - out_days
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_report
- id: loop_1
  type: LOOP
  config:
    condition: '@in_ticker IN @in_tickers'
    outputs:
      raw_data:
        from: tool_1.out_raw_data
      metrics:
        from: tool_2.out_metrics
      insight:
        from: gen_1.out_insight
      report:
        from: set_2.out_report
    subgraph:
      nodes:
      - id: tool_1
        type: SOLVE
        config:
          tool: fetch_ohlcv
          backend: kernel
          arguments:
          - '@ticker'
          - '@days'
          code: |
            import urllib.request, json, datetime

            def fetch_ohlcv(ticker: str, days: str) -> str:
                """Fetch recent OHLCV data from Yahoo Finance (no API key needed)."""
                try:
                    n = int(days)
                    end_ts   = int(datetime.datetime.utcnow().timestamp())
                    start_ts = end_ts - n * 86400
                    url = (
                        f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}"
                        f"?period1={start_ts}&period2={end_ts}&interval=1d"
                    )
                    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                    with urllib.request.urlopen(req, timeout=10) as resp:
                        data = json.loads(resp.read())
                    result = data["chart"]["result"][0]
                    times  = result["timestamp"]
                    closes = result["indicators"]["quote"][0]["close"]
                    rows   = []
                    for t, c in zip(times, closes):
                        if c is None:
                            continue
                        date = datetime.datetime.utcfromtimestamp(t).strftime("%Y-%m-%d")
                        rows.append(f"{date},{round(c, 2)}")
                    return "date,close\n" + "\n".join(rows) if rows else "error: no data"
                except Exception as e:
                    return f"error: {e}"
            _spl_result = fetch_ohlcv(ticker, days)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - ticker
          - days
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_ticker
        - in_days
        - out_raw_data
      - id: tool_2
        type: SOLVE
        config:
          tool: compute_metrics
          backend: kernel
          arguments:
          - '@raw_data'
          code: |
            def compute_metrics(csv_data: str) -> str:
                """Compute simple price metrics from date,close CSV."""
                try:
                    lines = [l for l in csv_data.strip().splitlines() if l and not l.startswith("date")]
                    if not lines:
                        return "error: empty data"
                    closes = []
                    for line in lines:
                        parts = line.split(",")
                        if len(parts) >= 2:
                            try:
                                closes.append(float(parts[1]))
                            except ValueError:
                                pass
                    if len(closes) < 2:
                        return "error: insufficient data"
                    start_p = closes[0]
                    end_p   = closes[-1]
                    high_p  = max(closes)
                    low_p   = min(closes)
                    change  = round((end_p - start_p) / start_p * 100, 2)
                    avg_p   = round(sum(closes) / len(closes), 2)
                    return (
                        f"start={start_p},end={end_p},high={high_p},"
                        f"low={low_p},change_pct={change},avg={avg_p},n={len(closes)}"
                    )
                except Exception as e:
                    return f"error: {e}"
            _spl_result = compute_metrics(raw_data)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - csv_data
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_raw_data
        - out_metrics
      - id: gen_1
        type: GENERATE
        config:
          function: interpret_metrics
          params:
          - ticker
          - metrics
          prompt_inline: |-
            You are a financial analyst. Given the following price metrics for {{in_ticker}},
            write a concise two-sentence summary covering:
              1. Overall trend direction (bullish / bearish / sideways).
              2. One key risk or opportunity based on the data.

            Metrics: {{in_metrics}}
          arguments:
          - '@ticker'
          - '@metrics'
        ports:
        - trigger
        - complete
        - in_ticker
        - in_metrics
        - out_insight
      - id: set_2
        type: CONTEXT
        config:
          action: set
          expression: '@in_report + @in_ticker + '': '' + @in_insight + ''\n\n'''
        ports:
        - trigger
        - complete
        - in_report
        - in_ticker
        - in_insight
        - out_report
      edges:
      - source: tool_1.complete
        target: tool_2.trigger
        type: triggers
      - source: tool_1.out_raw_data
        target: tool_2.in_raw_data
        type: binds
      - source: tool_2.complete
        target: gen_1.trigger
        type: triggers
      - source: tool_2.out_metrics
        target: gen_1.in_metrics
        type: binds
      - source: gen_1.complete
        target: set_2.trigger
        type: triggers
      - source: gen_1.out_insight
        target: set_2.in_insight
        type: binds
  ports:
  - trigger
  - loop
  - exit
  - in_ticker
  - in_days
  - in_report
  - in_tickers
  - out_raw_data
  - out_metrics
  - out_insight
  - out_report
- id: gen_2
  type: GENERATE
  config:
    function: synthesize_report
    params:
    - tickers
    - summaries
    - days
    prompt_inline: |-
      You are a portfolio manager. Given the following per-stock summaries for {{in_tickers}},
      produce a brief (3–5 sentence) consolidated portfolio outlook that:
        - opens with the tickers and time frame,
        - Highlights the best and worst performers.
        - Notes any correlated risk across the portfolio.
        - Ends with a single actionable recommendation.

      Summaries:
      {{in_summaries}}
    arguments:
    - '@tickers'
    - '@report'
    - '@days'
  ports:
  - trigger
  - complete
  - in_tickers
  - in_summaries
  - in_days
  - out_synthesis
- id: set_3
  type: CONTEXT
  config:
    action: set
    expression: '@in_synthesis'
  ports:
  - trigger
  - complete
  - in_synthesis
  - out_report
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_report
edges:
- source: wf_entry.entry
  target: set_1.trigger
  type: triggers
- source: set_1.complete
  target: loop_1.trigger
  type: triggers
- source: wf_entry.out_days
  target: loop_1.in_days
  type: binds
- source: set_1.out_report
  target: loop_1.in_report
  type: binds
- source: wf_entry.out_tickers
  target: loop_1.in_tickers
  type: binds
- source: loop_1.exit
  target: gen_2.trigger
  type: triggers
- source: wf_entry.out_tickers
  target: gen_2.in_tickers
  type: binds
- source: loop_1.out_report
  target: gen_2.in_summaries
  type: binds
- source: wf_entry.out_days
  target: gen_2.in_days
  type: binds
- source: gen_2.complete
  target: set_3.trigger
  type: triggers
- source: gen_2.out_synthesis
  target: set_3.in_synthesis
  type: binds
- source: set_3.out_report
  target: wf_exit.in_report
  type: binds
- source: set_3.complete
  target: wf_exit.trigger
  type: triggers
